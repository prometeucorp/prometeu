# Run Prometeu from its own isolated workspace to validate the complete development flow.
# Available script variables:
# $PROMETEU_WORKSPACE_PATH: the worktree where scripts run.
# $PROMETEU_ROOT_PATH: the original repository.
# $PROMETEU_WORKSPACE_NAME: the workspace name.
# $PROMETEU_PORT: its reserved port, followed by nine more through +9.
# $PORT: the same port for tools following that convention.

[scripts]
# Install frontend dependencies; no separate hook or sidecar binary is needed before cargo runs.
setup = "npm install"

# Start the real app with this worktree's own port and ~/.prometeu-dev-<workspace> state root, including
# native Tauri, PTY and agent behavior.
[scripts.run.app]
command = "node scripts/app.mjs"
default = true

# Build a debug .app and open it through LaunchServices. Only this path can dictate: macOS TCC
# reads the speech usage description from a bundle the app launched itself, so `tauri dev` hides
# the microphone. No hot reload.
[scripts.run.bundle]
command = "sh scripts/app-bundle.sh"

# Run the same UI in Chrome through src/mock.ts, for browser automation without the Rust backend.
# WKWebView does not expose CDP.
# Keep Vite in the background and wait in the foreground so stopping the dock terminates the server. Use
# localhost for IPv6 binding, and kill -0 to stop polling if Vite exits before becoming ready.
[scripts.run.browser]
command = """
PORT=$PROMETEU_PORT npx vite &
VITE=$!
until curl -sf "http://localhost:$PROMETEU_PORT" >/dev/null; do
  kill -0 "$VITE" 2>/dev/null || exit 1
  sleep 0.2
done
open -a "Google Chrome" "http://localhost:$PROMETEU_PORT"
wait
"""
