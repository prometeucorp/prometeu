<style id="shared-styles">/* Shared Prometeu design tokens. */

  --text-lg: 18px;
  --text-title: 32px;
  --shadow: 0 16px 48px rgb(0 0 0 / .18);
  --bg: #141110;
  --bg-side: #1b1917;
  --bg-raised: #201e1c;
  --bg-raised-2: #2b2826;
  --bg-raised-3: #373533;

  --line: #2b2826;

  --line-raised: #373533;

  --fg-2: #a4a09d;
  --fg-3: #756f6c;
  --tab-line: #d8c2b3;

  --bubble: #281e1d;
  --pri: #eae8e6;
  --pri-fg: #141110;
  --accent: #ff6b3d;
  --run: #4fb8b0;   --run-bg: #16302e;
  --wait: #e0a030;  --wait-bg: #33270f;
  --done: #5fbf73;  --done-bg: #16301d;
  --err: #e06c6c;   --err-bg: #341a1a;
  /* Subtle diff backgrounds preserve syntax-highlighting contrast. */
  --add-bg: #18291d;
  --del-bg: #2c1a1a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
  --r-lg: 8px;
  --r-xl: 10px;
}

.ui-button {
  box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); min-height: var(--button-height); height: auto; padding: 0 var(--space-4);
  border: 1px solid var(--line-ghost); border-radius: var(--r); background: none; color: var(--fg);
  font: inherit; font-weight: 500; line-height: 1.4; text-decoration: none; cursor: pointer;
}
.ui-button:hover { background: var(--bg-raised); }
.ui-button.pri { background: var(--pri); border-color: transparent; color: var(--pri-fg); }
.ui-button.pri:hover { background: #fff; }
.ui-button.ghost { border-color: transparent; color: var(--fg-2); }
.ui-button.ghost:hover { background: var(--bg-raised-2); color: var(--fg); }

.ui-button.danger:hover { background: var(--err-bg); }
.ui-button[aria-disabled="true"] { opacity: .45; cursor: wait; }
.ui-button:focus-visible, .ui-input:focus-visible, .ui-select:focus-visible,
.ui-check > input[type="checkbox"]:focus-visible, .ui-link:focus-visible, .ui-nav-link:focus-visible {
  outline: 2px solid var(--tab-line); outline-offset: 3px;
}

.ui-button:disabled, .ui-select:disabled { opacity: .45; cursor: not-allowed; }
.ui-field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.ui-label { font-size: var(--label-size); color: var(--fg-2); }
.ui-hint { margin: 0; font-size: var(--hint-size); color: var(--fg-2); line-height: 1.5; }
.ui-error, .ui-hint.ui-error { color: var(--err); }
.ui-error:empty { display: none; }
.ui-input, .ui-select { min-height: var(--control-height); padding: 7px 10px; border: 1px solid var(--line-raised); border-radius: var(--r); background: var(--bg); color: var(--fg); font: inherit; }
.ui-input { box-sizing: border-box; width: 100%; min-width: 0; user-select: text; }
.ui-input::placeholder { color: var(--fg-3); }

.ui-input:disabled { opacity: .45; cursor: not-allowed; }
.ui-input[aria-invalid="true"], .ui-select[aria-invalid="true"] { border-color: var(--err); }
.ui-select { box-sizing: border-box; display: inline-flex; align-items: center; width: 100%; height: auto; text-align: left; justify-content: space-between; gap: var(--space-2); cursor: pointer; }

<style>
* { box-sizing: border-box; }

.edge { fill: none; stroke: #625449; stroke-width: 1.1; opacity: .37; transition: opacity .3s, stroke .3s; }
.edge.candidate { stroke-dasharray: 3 5; }

function getMatches() {

function calculateHighlight(results) {
  matched = new Set(results.map(node=>node.key)); context=new Set(); litEdges=new Set();

  // Direction remains available in the relationship labels; this view shows connectivity.
