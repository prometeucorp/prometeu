  --bg: #141110;
  --bg-side: #1b1917;

}

  <style>

    .item-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .item-id { font: 12px var(--mono); color: var(--fg-2); white-space: nowrap; }
    .item-copy { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .item-project { color: var(--fg-2); font-size: 12px; margin-left: 8px; }
    .item-state { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 12px; white-space: nowrap; }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
    .item-age { font-size: 12px; color: var(--fg-2); text-align: right; white-space: nowrap; }
    .signal.bad { color: var(--err); }
    .signal { font-size: 11px; color: var(--done); }
    .signal.waiting { color: var(--wait); }
    .row-action { position: relative; z-index: 2; font-size: 12px; padding: 0 8px; white-space: nowrap; }
    .group-title { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px; margin: 8px 0 0; color: var(--fg-2); font-size: 13px; font-weight: 500; }
    .priority { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .priority i { width: 3px; border-radius: 1px; background: var(--fg-2); height: 5px; }
    .priority i:nth-child(2) { height: 8px; }.priority i:nth-child(3) { height: 12px; }
    .footer { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 32px; font-size: 10px; color: var(--fg-2); }

      { number: 142, identifier: 'ENG-142', team: 'Engineering', project: 'Desktop', repo: repos[0].name, title: 'Keep terminal sessions alive when switching tabs', assignee: 'gustavo', state: 'started', hours: 1, branch: 'gustavo/eng-142-terminal-sessions', description: 'Preserve terminal sessions while moving between conversation tabs.' },
      { number: 138, identifier: 'ENG-138', team: 'Engineering', project: 'Desktop', repo: repos[0].name, title: 'Improve workspace keyboard navigation', assignee: 'gustavo', state: 'unstarted', hours: 3, branch: 'gustavo/eng-138-workspace-navigation', description: 'Keep focus consistent while navigating the workspace list with a keyboard.' },
      { number: 57, identifier: 'CLD-57', team: 'Cloud', project: 'Team management', repo: repos[1].name, title: 'Show pending invitations in the team directory', assignee: 'gustavo', state: 'backlog', hours: 5, branch: 'gustavo/cld-57-pending-invitations', description: 'Display pending organization invitations alongside active members.' },
      { number: 145, identifier: 'ENG-145', team: 'Engineering', project: 'Desktop', repo: repos[0].name, title: 'Explain repository selection in the launcher', assignee: null, state: 'unstarted', hours: 2, branch: 'gustavo/eng-145-repository-selection', description: 'Help new users select the repository for their first workspace.' },
      { number: 61, identifier: 'CLD-61', team: 'Cloud', project: 'Team management', repo: repos[1].name, title: 'Add an invitation expiry reminder', assignee: null, state: 'backlog', hours: 6, branch: 'gustavo/cld-61-invitation-reminder', description: 'Indicate when an organization invitation is about to expire.' },
    ].map(item => ({ ...item, provider: 'linear', kind: 'issue' }));
    const key = item => `${item.provider ?? 'github'}/${item.repo}/${item.kind}/${item.number}`;
    const url = item => item.provider === 'linear' ? `https://linear.app/prometeu/issue/${item.identifier}` : `https://github.com/${item.repo}/${item.kind === 'issue' ? 'issues' : 'pull'}/${item.number}`;
    let provider = 'github', tab = 'mine', query = '', repoFilter = '';
    let chosen = new Set([repos[0].name, repos[1].name]);
    const workspaces = new Map([[key(issues[1]), { name: 'Archived search', branch: issues[1].branch }], [key(prs[0]), { name: 'Preserve workspace drafts', branch: prs[0].branch }]]);
    function source(name = tab) {
      if (provider === 'linear') return linearIssues.filter(item => name === 'mine' ? item.assignee === 'gustavo' : !item.assignee);
      if (name === 'mine') return issues.filter(item => item.assignee === 'gustavo');
      if (name === 'repositories') return issues.filter(item => chosen.has(item.repo));
      return prs.filter(item => name === 'authored' ? item.author === 'gustavo' : item.state === 'requested');
    }
    function filtered() {
      const words = query.toLowerCase().trim().split(/\s+/);
      return source().filter(item => (!repoFilter || (provider === 'linear' ? item.team : item.repo) === repoFilter) && words.every(word => `${item.title} ${item.repo} ${item.identifier ?? `#${item.number}`} ${item.project ?? ''} ${item.label ?? ''}`.toLowerCase().includes(word)));
    }
    let toastTimer;
    function say(text) { clearTimeout(toastTimer); $('toast').textContent = text; $('toast').hidden = false; toastTimer = setTimeout(() => $('toast').hidden = true, 4000); }
    function selectControl(options, label) {
      const select = el('select', 'scope-select'); select.setAttribute('aria-label', label);
      options.forEach(([value, text]) => { const option = el('option', '', text); option.value = value; select.append(option); });
      return select;
    }
    const search = input(); search.placeholder = t('search'); search.setAttribute('aria-label', t('search'));
    search.oninput = () => { query = search.value; drawList(); };
    search.onkeydown = event => { if (event.key === 'Escape') { search.value = query = ''; drawList(); } };
    const filter = selectControl([['', t('allRepos')], ...repos.map(repo => [repo.name, repo.name])], t('allRepos'));
    filter.onchange = () => { repoFilter = filter.value; drawList(); };
    const repoButton = button(t('chooseRepos'), chooseRepositories); repoButton.id = 'choose-repositories';
    $('toolbar').append(search, filter, repoButton);
    $('refresh').append(button(t('refresh'), () => { say(t('refreshed')); $('updated').textContent = t('updated'); }, 'ghost'));
    const tabs = new Map();
    for (const name of ['mine', 'available', 'repositories', 'authored', 'reviews']) {
      const control = button('', () => { tab = name; query = search.value = ''; repoFilter = filter.value = ''; draw(); }, 'ghost');
      control.append(el('span', '', t(name)), el('span', 'count')); control.id = `tab-${name}`;
      tabs.set(name, control); $('tabs').append(control);
    }
    const providers = new Map();
    $('providers').setAttribute('aria-label', t('providers'));
    $('tabs').setAttribute('aria-label', t('scopes'));
    for (const [id, label] of [['linear', 'Linear'], ['github', 'GitHub']]) {
      const control = button(label, () => { provider = id; tab = 'mine'; query = search.value = ''; repoFilter = ''; updateFilter(); draw(); }, 'ghost');
      providers.set(id, control); $('providers').append(control);
    }
    function updateFilter() {
      const options = provider === 'linear' ? [['', t('allTeams')], ['Engineering', 'Engineering'], ['Cloud', 'Cloud']] : [['', t('allRepos')], ...repos.map(repo => [repo.name, repo.name])];
      filter.replaceChildren(...options.map(([value, label]) => { const option = el('option', '', label); option.value = value; return option; }));
      filter.setAttribute('aria-label', t(provider === 'linear' ? 'allTeams' : 'allRepos'));
    }
    function draw() {
      providers.forEach((control, id) => control.setAttribute('aria-pressed', String(provider === id)));
      tabs.forEach((control, name) => {
        control.hidden = provider === 'linear' ? !['mine', 'available'].includes(name) : name === 'available';
        control.setAttribute('aria-pressed', String(tab === name)); control.lastChild.textContent = source(name).length;
      });
      $('scope-hint').textContent = t(provider === 'linear' && tab === 'mine' ? 'linearMineHint' : `${tab}Hint`);
      repoButton.hidden = provider === 'linear';
      repoButton.textContent = `${t('chooseRepos')} (${chosen.size})`;
      drawList(); drawWorkspaces();
    }
    function drawList() {
      const items = filtered();
      $('list-title').textContent = t(tab); $('result-count').textContent = t('result', { n: items.length });
      $('list').replaceChildren();
      const groups = provider === 'linear' ? ['started', 'unstarted', 'backlog'] : ['all'];
      for (const group of groups) {
        const members = group === 'all' ? items : items.filter(item => item.state === group);
        if (!members.length) continue;
        if (group !== 'all') {
          const heading = el('h2', 'group-title', t(group)); heading.append(el('span', 'count', members.length)); $('list').append(heading);
        }
        for (const item of members) {
          const row = el('article', 'item'); row.dataset.item = key(item);
          const link = el('a', 'item-link'); link.href = url(item); link.target = '_blank'; link.rel = 'noopener noreferrer'; link.setAttribute('aria-label', item.title); link.title = url(item);
          const glyph = el('span', 'item-icon'); glyph.setAttribute('aria-hidden', 'true');
          glyph.innerHTML = item.provider === 'linear' ? '<span class="priority"><i></i><i></i><i></i></span>' : item.kind === 'issue' ? '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/></svg>' : '<svg viewBox="0 0 20 20"><circle cx="5" cy="4" r="2"/><circle cx="5" cy="16" r="2"/><circle cx="15" cy="16" r="2"/><path d="M5 6v8m10 0V8c0-3-5-4-5-4m0 0 3-2m-3 2 3 2"/></svg>';
          const copy = el('div', 'item-copy');
          copy.title = `${item.title} · ${item.project ?? item.repo}`;
          copy.append(el('span', 'item-title', item.title), el('span', 'item-project', item.project ?? item.repo));
          const state = el('span', 'item-state');
          state.append(el('i', 'state-dot'), el('span', '', t(item.state ?? 'openState')));
          if (item.checks) {
            const check = el('span', `signal ${item.checks === 'failing' ? 'bad' : item.checks === 'pending' ? 'waiting' : ''}`, item.checks === 'passing' ? '✓' : item.checks === 'failing' ? '×' : '◷');
            check.setAttribute('aria-label', `${t('checks')}: ${t(item.checks)}`); check.title = `${t('checks')}: ${t(item.checks)}`; state.append(check);
          }
          const action = button(t('open'), () => openWorkspace(item), 'ghost');
          action.classList.add('row-action'); action.dataset.focus = `launch-${key(item)}`;
          row.append(link, glyph, el('span', 'item-id', item.identifier ?? `#${item.number}`), copy, state, action, el('span', 'item-age', t('updatedAgo', { n: item.hours }))); $('list').append(row);
        }
      }
      if (!items.length) {
        const noRepos = tab === 'repositories' && !chosen.size;
        const empty = el('div', 'empty'); empty.append(el('h2', '', t(noRepos ? 'noRepos' : 'noMatch')), el('p', '', t(noRepos ? 'noReposBody' : 'noMatchBody')),
          button(t(noRepos ? 'chooseRepos' : 'clear'), noRepos ? chooseRepositories : () => { search.value = query = ''; filter.value = repoFilter = ''; drawList(); }));
        $('list').append(empty);
      }
    }
    function chooseRepositories() {
      const choices = new Map();
      const dialog = formDialog({ title: t('selectedRepos'), save: t('save'), cancel: t('cancel'), error: String,
        submit: async () => { chosen = new Set([...choices].filter(([, control]) => control.checked).map(([name]) => name)); draw(); },
      });
      dialog.body.append(el('p', '', t('repoHelp')));
      for (const repo of repos) {
        const check = checkbox(repo.name, chosen.has(repo.name)); choices.set(repo.name, check.control);
        const row = el('div', 'repo-choice'); row.append(check.label, el('small', '', t(repo.path ? 'local' : 'remote'))); dialog.body.append(row);
      }
      dialog.open();
    }
    function openWorkspace(item) {
      const existing = workspaces.get(key(item));
      if (existing) {
        const dialog = formDialog({ title: existing.name, save: t('back'), cancel: t('cancel'), error: String, submit: async () => {} });
        dialog.body.append(el('p', '', t('workspaceOpened', { name: existing.name })), el('div', 'workspace-context', `${item.repo}\n${existing.branch}`), el('p', '', t('previewNote')));
        dialog.open(); return;
      }
      const repo = repos.find(repo => repo.name === item.repo);
      const name = input(item.title); name.required = true;
      const directory = input(repo.path); directory.required = true; directory.placeholder = '/Projects/repository';
      directory.pattern = '/.+'; directory.title = t('pathRequired');
      const branch = input(item.branch); branch.required = true; branch.readOnly = item.kind === 'pr';
      const agent = selectControl([['codex', 'Codex'], ['claude', 'Claude'], ['antigravity', 'Antigravity']], t('agent'));
      const context = input(`${item.title}\n${url(item)}\n\n${item.description}`, true);
      const dialog = formDialog({ title: t(item.state === 'requested' ? 'reviewWorkspace' : 'newWorkspace'), save: t('createPreview'), cancel: t('cancel'), error: String,
        submit: async () => { workspaces.set(key(item), { name: name.value, branch: branch.value, directory: directory.value, agent: agent.value, context: context.value }); draw(); say(t('workspaceCreated')); },
      });
      dialog.body.append(el('div', 'workspace-context', `${t('source')}: ${item.identifier ?? `${item.repo} #${item.number}`}`), field(t('workspaceName'), name), field(t('directory'), directory, repo.path ? '' : t('directoryHint')), field(t('branch'), branch), field(t('agent'), agent), field(t('context'), context), el('p', '', t('previewNote')));
      dialog.open();
    }
    function drawWorkspaces() {
      $('workspace-list').replaceChildren();
      workspaces.forEach((workspace, id) => {
        const item = [...issues, ...prs, ...linearIssues].find(item => key(item) === id);
        const control = button(workspace.name, () => openWorkspace(item), 'ghost'); control.classList.add('workspace-link');
        $('workspace-list').append(control);
      });
    }
    draw();
  </script>
</body>
</html>
