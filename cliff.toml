# git-cliff derives CHANGELOG.md and release notes from Conventional Commits. Include user-visible feat,
# fix, perf and revert entries; omit internal maintenance changes.
# Public commit descriptions explain observable behavior in English without implementation filenames
# or function names. Commits made before the English-only policy carry that line in a Release-EN
# footer, which the template prefers so regenerating the changelog keeps history in English.
# See AGENTS.md.

[changelog]
header = """
# Changelog

What changes in Prometeu, version by version, for whoever uses the app.
Versions come from `sh scripts/release.sh`; this file is generated from the
commits by git-cliff, and each release's notes on GitHub are its section.

"""
body = """
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}{% set_global release_en = "" %}{% for footer in commit.footers %}{% if footer.token == "Release-EN" %}{% set_global release_en = footer.value %}{% endif %}{% endfor %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if release_en %}{{ release_en | trim | upper_first }}{% else %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="
") | first | trim | upper_first }}{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
# Keep legacy unconventional commits in the fallback group instead of silently dropping them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
  # These commits were labeled fix but only refactored process parameters and development setup. Exclude
  # them without rewriting main.
  { sha = "09b19f1538a3d717e89482c37d5039d86b8fa2f6", skip = true },
  { sha = "cf6ada07ddfacb2d970d2fc15e4684b3344e417a", skip = true },
  # The first branding PR retained its original commit and a duplicate public merge message. Count only
  # the original.
  { sha = "d35d5c3132adf64caa63006dadfb0aa73bfec7a2", skip = true },
  # This feat(ui) commit only reorganized shared components without changing visible behavior. Exclude it
  # without rewriting main.
  { sha = "15bbd4235cbbb7a04227494adcc8171a1a46b0aa", skip = true },
  # These fix(mcp) commits were described in Portuguese; the commit that skips them carries the English
  # entry.
  { sha = "cef2531a68abfde3c10faad0293a95133cebeadb", skip = true },
  { sha = "12dc84a46917510da6392b64b0f8fcb6c24585fc", skip = true },
  # These automations commits shipped a feature that was removed before any release. Exclude them
  # without rewriting main.
  { sha = "c57c2163fc24b2e8a3072a6807e681b5be7c6193", skip = true },
  { sha = "11b92d70c2f270121c05ad27e1673099b1957f4b", skip = true },
  { sha = "c11d0eac6c4493a7c946b192bbb0c1c6731c12b2", skip = true },
  { sha = "1e88ff5ff1f8cbe92dde65d8d236759f0cc8e03a", skip = true },
  { sha = "661f6c16a26615611e3b8850572c736ec5ab4f88", skip = true },
  { sha = "16e3b5f671c8da6ecb93a2a37e88479e3dba1a4d", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = '^Revert "chore\(release\)', skip = true },
  { message = "^Marcar a versão", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = "^(chore|ci|build|docs|test|style|refactor)(\\(|:|!)", skip = true },
  { message = ".*", group = "<!-- 4 -->Other" },
]

[bump]
# Features bump minor and fixes bump patch. During 0.x, breaking changes also bump minor. Moving to
# 1.0 requires an explicit decision.
features_always_bump_minor = true
breaking_always_bump_major = false
