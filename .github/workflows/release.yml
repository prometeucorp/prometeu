# Build both platforms in parallel on GitHub-hosted runners, then assemble one verified draft
# release in this repository. Notes come from the version's CHANGELOG.md section.
# Drafts do not reach the updater's releases/latest/download/latest.json endpoint. Install and review the
# draft DMG and AppImage before running sh scripts/release.sh publish.
# The updater accepts only newer versions; recovery from a published defect requires a newer release.
# workflow_dispatch verifies a release build from main without publishing or consuming a version.
#
# The draft lands in this same repository, so the job's GITHUB_TOKEN with contents: write is enough;
# no PAT is involved.
#
# Required Secrets (environment "release"):
# TAURI_SIGNING_PRIVATE_KEY: contents of ~/.tauri/prometeu.key.
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD: signing key password.
# APPLE_ID: Apple account email.
# APPLE_PASSWORD: app-specific notarization password.
# APPLE_CERTIFICATE: Developer ID Application certificate as base64-encoded .p12.
# APPLE_CERTIFICATE_PASSWORD: .p12 password.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A rerun must not overwrite a manifest while another run uploads to the same draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  build:
    name: Build and sign macOS
    runs-on: macos-latest
    environment: release
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: commit pertence à main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release só constrói commits que já pertencem à main"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: desktop-macos

      - run: npm ci

      - name: navegador dos testes de fluxo
        run: npx playwright install chromium webkit

      # Run the same CI gates before signing or publishing.
      - run: npm run check

      - name: versão e notas
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $VERSION do package.json"
            exit 1
          fi
          # Extract the version's CHANGELOG.md section without its heading.
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ { dentro = index($0, "## [" v "]") == 1; next }
            dentro { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md não tem a seção [$VERSION]"
            exit 1
          fi
          { echo "notes<<FIM_DAS_NOTAS"; printf '%s\n' "$NOTES"; echo "FIM_DAS_NOTAS"; } >> "$GITHUB_OUTPUT"

      - name: importar certificado Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_ID" ] || { echo "::error::falta o secret APPLE_ID"; exit 1; }
          [ -n "$APPLE_PASSWORD" ] || { echo "::error::falta o secret APPLE_PASSWORD"; exit 1; }
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::falta o secret APPLE_CERTIFICATE"; exit 1; }
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || { echo "::error::falta o secret APPLE_CERTIFICATE_PASSWORD"; exit 1; }

          CERTIFICATE_PATH="$RUNNER_TEMP/prometeu-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/prometeu-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/prometeu-keychains.txt"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"$//' > "$KEYCHAIN_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F '"Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"' >/dev/null \
            || { echo "::error::o .p12 não contém o Developer ID Application esperado"; exit 1; }
          KEYCHAINS=()
          while IFS= read -r KEYCHAIN; do
            [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
          done < "$KEYCHAIN_LIST_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"
          echo "APPLE_BUILD_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_LIST=$KEYCHAIN_LIST_PATH" >> "$GITHUB_ENV"

      # npm run check already produced and validated dist; keep the local Tauri hook unchanged.
      - name: Build signed macOS packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "6MQT6A482B"
          # Avoid Finder AppleScript and its Automation permission on disposable runners.
          CI: "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        run: |
          npm run tauri -- build --verbose --config '{"build":{"beforeBuildCommand":""}}'

      - name: notarizar DMG final
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "::error::falta o .dmg"; exit 1; }
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id 6MQT6A482B \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          mkdir -p pkg
          cp "$DMG" pkg/Prometeu_aarch64.dmg
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz pkg/Prometeu_aarch64.app.tar.gz
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig pkg/Prometeu_aarch64.app.tar.gz.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: pkg/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: remover Keychain temporário
        if: always()
        run: |
          if [ -f "${APPLE_KEYCHAIN_LIST:-}" ]; then
            KEYCHAINS=()
            while IFS= read -r KEYCHAIN; do
              [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
            done < "$APPLE_KEYCHAIN_LIST"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}"
            fi
          fi
          if [ -n "${APPLE_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_BUILD_KEYCHAIN" || true
          fi

  # Build independently; only the final job writes the shared draft and latest.json.
  linux:
    name: Build and sign Linux
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Build on the oldest supported Ubuntu baseline to avoid requiring a newer glibc.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: desktop-linux-ubuntu-22.04

      - run: npm ci
      - run: npm run build
      - run: npm run test:rust
      - run: npm run lint:rust

      - name: Build signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --verbose --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'

      # The bundled Ubuntu 22.04 libwayland breaks EGL on current Mesa (black window); the host must
      # provide it. Repacking invalidates the updater signature, so sign the patched file again.
      - name: Unbundle libwayland from the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected exactly one AppImage"; exit 1; }
          bash scripts/appimage-unbundle-wayland.sh "${images[0]}"
          rm -f "${images[0]}.sig"
          npx tauri signer sign "${images[0]}"
          mkdir -p pkg
          cp "${images[0]}" pkg/Prometeu_x86_64.AppImage
          cp "${images[0]}.sig" pkg/Prometeu_x86_64.AppImage.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: pkg/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Assemble and verify draft
    needs: [build, linux]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    # Drafts are visible only to write access, so downloading one needs contents: write.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_NOTES: ${{ needs.build.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: command -v minisign >/dev/null || brew install minisign

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: pkg

      - name: Assemble manifest and verify both updater packages
        run: python3 scripts/verify-release.py --assemble "$VERSION" "$REPO" pkg

      - name: Verify Apple notarization before uploading
        run: |
          xcrun stapler validate pkg/Prometeu_aarch64.dmg
          spctl -a -t open --context context:primary-signature -v pkg/Prometeu_aarch64.dmg

      - name: Upload verified packages to the draft
        run: sh scripts/release.sh draft "$VERSION" pkg

      - name: Verify the downloaded draft
        run: |
          gh release download "v$VERSION" -R "$REPO" -D downloaded
          xcrun stapler validate downloaded/Prometeu_aarch64.dmg
          spctl -a -t open --context context:primary-signature -v downloaded/Prometeu_aarch64.dmg
          python3 scripts/verify-release.py "$VERSION" "$REPO" downloaded
