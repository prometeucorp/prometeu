# Build the experimental Windows installer on request. It embeds the Linux runtime built from the
# same commit, is unsigned and is not part of a release: release.yml publishes only macOS and Linux.
# Run it from Actions > Windows installer > Run workflow; the installer is a seven-day artifact.
name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    name: matching Linux runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: windows-runtime

      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p prometeu-runtime --release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-linux-runtime
          path: src-tauri/target/release/prometeu-runtime
          retention-days: 1

  windows-installer:
    name: windows installer
    needs: windows-runtime
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: windows-installer

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-linux-runtime
          path: ${{ runner.temp }}/runtime-package

      - run: npm run package:windows
        env:
          PROMETEU_WSL_RUNTIME: ${{ runner.temp }}/runtime-package/prometeu-runtime

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
