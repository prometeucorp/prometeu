  <style id="shared-styles">/* Shared Prometeu design tokens. */
:root {
  color-scheme: dark;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --control-height: 32px;
  --button-height: 28px;
  --label-size: 12px;
  --hint-size: 11.5px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 18px;
  --text-title: 32px;
  --shadow: 0 16px 48px rgb(0 0 0 / .18);
  --bg: #141110;
  --bg-side: #1b1917;
  --bg-raised: #201e1c;
  --bg-raised-2: #2b2826;
  --bg-raised-3: #373533;
  --bg-btn: #52504e;
  --line: #2b2826;
  --line-side: #32302f;
  --line-raised: #373533;
  --line-ghost: #434140;
  --fg: #eae8e6;
  --fg-2: #a4a09d;
  --fg-3: #756f6c;
  --tab-line: #d8c2b3;
  /* Warm brown distinguishes user messages from neutral surfaces. */
  --bubble: #281e1d;
  --pri: #eae8e6;
  --pri-fg: #141110;
  --accent: #ff6b3d;
  --run: #4fb8b0;   --run-bg: #16302e;
  --wait: #e0a030;  --wait-bg: #33270f;
  --done: #5fbf73;  --done-bg: #16301d;
  --err: #e06c6c;   --err-bg: #341a1a;
  /* Subtle diff backgrounds preserve syntax-highlighting contrast. */
  --add-bg: #18291d;
  --del-bg: #2c1a1a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
  --r-lg: 8px;
  --r-xl: 10px;
}

@import url("./tokens.css");

/* Opt-in components avoid global button, form or layout rules. */
.ui-comfortable { --control-height: 44px; --button-height: 44px; --label-size: 13px; --hint-size: 12px; }
.ui-comfortable .mrow { min-height: var(--control-height); }
.ui-button {
  box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); min-height: var(--button-height); height: auto; padding: 0 var(--space-4);
  border: 1px solid var(--line-ghost); border-radius: var(--r); background: none; color: var(--fg);
  font: inherit; font-weight: 500; line-height: 1.4; text-decoration: none; cursor: pointer;
}
.ui-button:hover { background: var(--bg-raised); }
.ui-button.pri { background: var(--pri); border-color: transparent; color: var(--pri-fg); }
.ui-button.pri:hover { background: #fff; }
.ui-button.ghost { border-color: transparent; color: var(--fg-2); }
.ui-button.ghost:hover { background: var(--bg-raised-2); color: var(--fg); }
.ui-button.danger { border-color: var(--err); color: var(--err); }
.ui-button.danger:hover { background: var(--err-bg); }
.ui-button[aria-disabled="true"] { opacity: .45; cursor: wait; }
.ui-button:focus-visible, .ui-input:focus-visible, .ui-select:focus-visible,
.ui-check > input[type="checkbox"]:focus-visible, .ui-link:focus-visible, .ui-nav-link:focus-visible {
  outline: 2px solid var(--tab-line); outline-offset: 3px;
}
.ui-link { color: var(--fg); text-underline-offset: 4px; }
.ui-link:hover { color: var(--accent); }
.ui-card { padding: var(--space-6); border: 1px solid var(--line-raised); border-radius: var(--r-xl); background: var(--bg-side); }
.ui-stack { display: flex; flex-direction: column; gap: var(--space-6); min-width: 0; }
.ui-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.ui-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px var(--space-2); border: 1px solid var(--line-raised); border-radius: var(--r); color: var(--fg-2); font-size: var(--text-sm); line-height: 1.5; }
.ui-badge.success { color: var(--done); background: var(--done-bg); border-color: transparent; }
.ui-notice { margin: 0; padding: var(--space-4); border: 1px solid var(--line-raised); border-radius: var(--r-lg); color: var(--fg-2); background: var(--bg-raised); line-height: 1.6; overflow-wrap: anywhere; }
.ui-notice.success { color: var(--done); background: var(--done-bg); }
.ui-notice.error { color: var(--err); background: var(--err-bg); }
.ui-notice.warning { color: var(--wait); background: var(--wait-bg); }
.ui-eyebrow { color: var(--accent); font: 500 var(--text-sm)/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.ui-nav-link { display: flex; align-items: center; gap: var(--space-2); padding: 6px var(--space-2); border-radius: var(--r); color: var(--fg-2); text-decoration: none; font-size: var(--text-base); line-height: 20px; }
.ui-nav-link:hover, .ui-nav-link[aria-current] { color: var(--fg); background: var(--bg-raised); }
.ui-nav-link[aria-current] { font-weight: 500; box-shadow: inset 2px 0 var(--tab-line); }
/* Avatar images fall back to person or organization glyphs. */
.ui-avatar { --avatar: 24px; flex: none; display: inline-grid; place-items: center; width: var(--avatar); height: var(--avatar); border-radius: 50%; overflow: hidden; background: var(--bg-raised-2); color: var(--fg-2); vertical-align: middle; }
.ui-avatar.md { --avatar: 32px; }
.ui-avatar.lg { --avatar: 40px; }
.ui-avatar.org { border-radius: var(--r); background: color-mix(in srgb, var(--accent) 18%, var(--bg-raised)); color: var(--accent); }

/* Underlined tabs share the desktop selection marker. */
.ui-tabs { display: flex; gap: var(--space-1); overflow-x: auto; border-bottom: 1px solid var(--line-raised); }

.ui-tabs > a:hover { color: var(--fg); }
.ui-tabs > a[aria-current] { color: var(--fg); font-weight: 500; box-shadow: inset 0 -2px var(--tab-line); }

/* Fields, selectors and forms share control dimensions. */
.ui-button:disabled, .ui-select:disabled { opacity: .45; cursor: not-allowed; }
.ui-field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }

.ui-error:empty { display: none; }
.ui-input, .ui-select { min-height: var(--control-height); padding: 7px 10px; border: 1px solid var(--line-raised); border-radius: var(--r); background: var(--bg); color: var(--fg); font: inherit; }
.ui-input { box-sizing: border-box; width: 100%; min-width: 0; user-select: text; }
.ui-input::placeholder { color: var(--fg-3); }

.ui-input:disabled { opacity: .45; cursor: not-allowed; }
.ui-input[aria-invalid="true"], .ui-select[aria-invalid="true"] { border-color: var(--err); }
.ui-select { box-sizing: border-box; display: inline-flex; align-items: center; width: 100%; height: auto; text-align: left; justify-content: space-between; gap: var(--space-2); cursor: pointer; }
.ui-select > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ui-select-field { position: relative; }
.ui-native-select { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; padding: 0; border: 0; }
.ui-select-menu { max-height: 40vh; max-width: calc(100vw - 16px); overflow-y: auto; }
.ui-select-menu .mrow { flex: none; }
.ui-check { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--label-size); color: var(--fg-2); line-height: 20px; }
.ui-check > input[type="checkbox"] { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; padding: 0; flex: none; border: 1px solid var(--line-ghost); border-radius: 4px; background: var(--bg); display: grid; place-content: center; }
.ui-check > input[type="checkbox"]:checked { background: var(--pri); border-color: var(--pri); }

.ui-radio > input:focus-visible { outline: 2px solid var(--tab-line); outline-offset: 3px; }

.ui-disclosure > .ui-field { margin-top: var(--space-3); }

/* Dialogs and menus work independently of application CSS. */
.sheet.ui-dialog { box-sizing: border-box; width: min(600px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; margin: auto; color: var(--fg); background: var(--bg-raised); border: 1px solid var(--line-raised); border-radius: var(--r-xl); box-shadow: var(--shadow); font: inherit; }
.sheet.ui-dialog[open] { display: flex; flex-direction: column; }
.ui-dialog .sheettop { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); flex: none; height: auto; min-height: 44px; padding: var(--space-6); border-bottom: 1px solid var(--line-raised); }
.ui-dialog::backdrop { background: rgb(0 0 0 / .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ui-dialog > form { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

.ui-dialog .sheettop b:focus { outline: none; }
.ui-form-body { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-6); min-height: 0; overflow-y: auto; }

.ui-dialog .ui-button { max-width: 100%; height: auto; white-space: normal; overflow-wrap: anywhere; }
.ui-dialog .ui-form-footer { display: flex; align-items: center; flex-wrap: wrap; flex: none; border-top: 1px solid var(--line-raised); padding: var(--space-4) var(--space-6); gap: var(--space-3); justify-content: flex-end; }

.menu, .upop {
  position: fixed; z-index: 30; min-width: 200px; padding: 5px;
  background: var(--bg-raised-2); border: 1px solid var(--line-ghost);
  border-radius: var(--r-lg); box-shadow: 0 20px 48px -12px rgb(0 0 0 / 0.85);
  display: flex; flex-direction: column; gap: 1px;
}
.menu hr { border: none; border-top: 1px solid var(--line-raised); margin: 4px 6px; width: auto; }
.mrow {
  border: 1px solid transparent; font: inherit; cursor: pointer;
  display: flex; align-items: center; gap: 10px; height: 30px; width: 100%;
  padding: 0 8px; border-radius: var(--r); background: none; color: var(--fg);
  font-weight: 400; justify-content: flex-start;
}
.mrow:hover, .mrow.sel { background: var(--bg-raised-3); }
.mrow .mg { display: flex; color: var(--fg-2); width: 16px; flex: none; }
.mrow .ml { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.mrow .mh { font-size: 12px; color: var(--fg-3); }
.mrow .mbadge { flex: none; padding: 1px 5px; border-radius: 4px; font-size: 10px; line-height: 16px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.mrow .mc { display: flex; color: var(--tab-line); width: 14px; flex: none; }
.mrow .ic { flex: none; }

.mrow.off, .mrow.off:hover { color: var(--fg-3); background: none; cursor: default; }
.mrow.off .mg { opacity: 0.5; }
.mrow.danger { color: var(--err); }
.mrow.danger:hover { background: var(--err-bg); }

.menu .ic, .ui-select .ic { flex: none; display: block; }
.menu:focus { outline: none; }
.mrow:focus-visible { outline: 2px solid var(--tab-line); outline-offset: -2px; }
.ui-password { display: flex; align-items: stretch; gap: var(--space-2); }
.ui-password > .ui-input { flex: 1; width: 0; }
.ui-password > .ui-button { flex: none; }

.ui-feedback-panel.ui-feedback-dropping { border-color: var(--accent); }
.ui-feedback-panel[hidden], .ui-feedback [hidden] { display: none; }
.ui-feedback-panel, .ui-feedback-panel form, .ui-feedback-notice, .ui-feedback-public, .ui-feedback-attachments { display: flex; flex-direction: column; gap: var(--space-3); }
.ui-feedback-heading { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }

.ui-search-picker-choice:hover, .ui-search-picker-choice:focus-visible { background: var(--bg-raised-3); }

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
    [hidden] { display: none !important; }

    .wordmark { font-weight: 650; letter-spacing: -.5px; color: var(--fg); }
    .wordmark i { color: var(--accent); font-style: normal; margin-right: 8px; }

    aside { padding: 30px 16px; background: var(--bg-side); border-right: 1px solid var(--line); }
    .eyebrow { color: var(--fg-2); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

    .topline { margin-bottom: 24px; }
    .breadcrumb { color: var(--fg-2); font-size: 12px; }

    .demo::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    h1 { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -1px; font-weight: 600; }
    h2 { margin: 0; font-size: 15px; font-weight: 550; }
    p { margin: 7px 0 0; }
    .muted, .note { color: var(--fg-2); }

    .metric:first-child .metric-value { color: var(--accent); }

    dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }

    .key { display: inline-block; width: 6px; height: 6px; border-radius: 2px; margin-right: 8px; }
    .key.input { background: var(--accent); } .key.output { background: var(--run); }
    .panel .note { margin-top: 18px; }
    .source { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .source:last-of-type { border: 0; }
    .source-label { display: flex; justify-content: space-between; font-size: 12px; gap: 12px; }
    .source-track { background: var(--bg-raised); height: 4px; border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .source-track span { display: block; height: 100%; background: var(--tab-line); }
    .sessions { margin-top: 30px; }
    .sessions .section-heading { margin-bottom: 14px; }
    .table-scroll { overflow-x: auto; }
    .table-scroll:focus-visible { outline: 2px solid var(--tab-line); outline-offset: 3px; }
    #session-table { min-width: 740px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { color: var(--fg-2); font-size: 10px; letter-spacing: .04em; font-weight: 500; padding: 10px 12px; background: var(--bg-side); }
    td { padding: 15px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    td.numeric, th.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .session-button.ui-button { padding: 0; min-height: 24px; color: var(--fg); text-align: left; justify-content: start; }
    .session-button.ui-button:hover { color: var(--accent); background: transparent; }
    .session-meta { color: var(--fg-2); font-size: 11px; margin-top: 3px; }
    .provider-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fg-2); margin-right: 7px; }
    .provider-dot.claude { background: var(--accent); } .provider-dot.codex { background: var(--run); }
    .empty { text-align: center; padding: 50px 20px; color: var(--fg-2); border: 1px dashed var(--line-raised); border-radius: var(--r); }
    .bottom-grid { margin-top: 24px; }
    .model-row { display: flex; justify-content: space-between; gap: 20px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .availability { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 18px; }
    summary { cursor: pointer; color: var(--fg-2); font-size: 12px; }
    summary:focus-visible { outline: 2px solid var(--tab-line); outline-offset: 4px; }
    .availability table { margin-top: 14px; }
    footer { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); margin-top: 28px; padding-top: 16px; font-size: 11px; color: var(--fg-2); }
    dialog { background: var(--bg-side); color: var(--fg); border: 1px solid var(--line-raised); border-radius: var(--r-xl); padding: 26px; width: min(620px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; }
    dialog::backdrop { background: #0009; }
    dialog h2 { font-size: 21px; }
    dialog .breakdown { margin: 24px 0; }
    dialog .dialog-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    @media (max-width: 1100px) { .shell { grid-template-columns: 140px minmax(0,1fr); } main { padding: 28px 24px; } .metric { padding: 18px 14px; } .metric-value { font-size: 25px; } }
    @media (max-width: 800px) { .shell { display: block; } aside { display: none; } .overview { grid-template-columns: 1fr; } .metrics { grid-template-columns: 1fr 1fr; } .metric:nth-child(2) { border-right: 0; } .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); } .metric:last-child { grid-column: 1 / -1; } .topline { flex-wrap: wrap; } }

  <script id="telemetry-model">
    // Synthetic measurements use the existing inclusive UsageCounts fields. No native data is read.
    const emptyUsage = () => ({ inputTokens: null, outputTokens: null, cacheReadTokens: null, cacheWriteTokens: null,
      reasoningTokens: null, contextUsed: null, contextWindow: null, peakContext: null, modelCalls: null,
      compactions: null, cacheRebuilds: null, costUsd: null });

    const conversations = { layout: 'Refine the workspace layout', reconnect: 'Fix relay reconnect', parser: 'Review the protocol parser',
      docs: 'Update contributor documentation', tests: 'Investigate flaky tests', resume: 'Resume the release review' };
    const sample = (date, workspaceId, conversationId, provider, complete, usage, source = 'conversation', usageByModel = null) => ({
      date, workspaceId, conversationId, provider, source,
      measurement: { usageScope: 'mainAgent', complete, selectedModel: null, observedModels: usageByModel?.map(row => row.model) ?? null,
        usage: { ...emptyUsage(), ...usage }, usageByModel },
    });
    const records = [
      sample('2026-10-27', 'desktop', 'layout', 'claude', true, { inputTokens: 420000, outputTokens: 18000, cacheReadTokens: 310000, cacheWriteTokens: 70000, costUsd: 1.42, peakContext: 64000, modelCalls: 9, compactions: 0, cacheRebuilds: 1 }, 'conversation', [{ model: 'claude-example-model', usage: { ...emptyUsage(), inputTokens: 420000, outputTokens: 18000 } }]),
      sample('2026-10-29', 'desktop', 'layout', 'claude', true, { inputTokens: 680000, outputTokens: 26000, cacheReadTokens: 520000, cacheWriteTokens: 90000, costUsd: 2.18, peakContext: 96000, modelCalls: 12, compactions: 1, cacheRebuilds: 0 }, 'conversation', [{ model: 'claude-example-model', usage: { ...emptyUsage(), inputTokens: 680000, outputTokens: 26000 } }]),
      sample('2026-10-30', 'desktop', 'layout', 'claude', true, { inputTokens: 205000, outputTokens: 8000, cacheReadTokens: 160000, cacheWriteTokens: 25000, costUsd: .65, peakContext: 76000, modelCalls: 4, compactions: 0, cacheRebuilds: 0 }),
      sample('2026-10-28', 'relay', 'reconnect', 'codex', true, { inputTokens: 540000, outputTokens: 32000, cacheReadTokens: 410000, reasoningTokens: 21000, peakContext: 88000, compactions: 1 }),
      sample('2026-10-31', 'relay', 'reconnect', 'codex', true, { inputTokens: 360000, outputTokens: 21000, cacheReadTokens: 280000, reasoningTokens: 12000, peakContext: 105000, compactions: 0 }),
      sample('2026-10-30', 'tools', 'parser', 'claude', true, { inputTokens: 190000, outputTokens: 12000, cacheReadTokens: 140000, cacheWriteTokens: 30000, costUsd: .81, peakContext: 46000, modelCalls: 5, compactions: 0, cacheRebuilds: 0 }),
      sample('2026-10-31', 'desktop', 'docs', 'antigravity', false, { inputTokens: 92000, outputTokens: 7000, peakContext: 32000, modelCalls: 3 }),
      sample('2026-11-01', 'tools', 'tests', 'codex', true, { inputTokens: 260000, outputTokens: 16000, cacheReadTokens: 180000, reasoningTokens: 9000, peakContext: 78000, compactions: 0 }),
      sample('2026-11-01', 'tools', 'tests', 'codex', false, { inputTokens: 48000, peakContext: 83000 }),
      sample('2026-11-01', 'tools', 'resume', 'codex', false, {}),
      sample('2026-10-30', 'desktop', null, 'claude', true, { inputTokens: 3000, outputTokens: 120, cacheReadTokens: 0, cacheWriteTokens: 0, costUsd: .012 }, 'naming'),
      sample('2026-10-31', null, null, 'claude', true, { inputTokens: 18000, outputTokens: 2400, cacheReadTokens: 10000, cacheWriteTokens: 4000, costUsd: .11 }, 'plugin-maker'),
      sample('2026-10-19', 'tools', 'parser', 'claude', true, { inputTokens: 120000, outputTokens: 9000, cacheReadTokens: 80000, cacheWriteTokens: 20000, costUsd: .47, peakContext: 39000, modelCalls: 3, compactions: 0, cacheRebuilds: 0 }),
    ];
    function filterRecords(rows, from, through, workspaceId = '') {
      // ISO calendar days keep the fixed examples independent of the viewer's timezone.
      return rows.filter(row => (!from || row.date >= from) && (!through || row.date <= through) && (!workspaceId || row.workspaceId === workspaceId));
    }
    function aggregate(rows) {
      const usage = emptyUsage();
      for (const { measurement } of rows) for (const [key, value] of Object.entries(measurement.usage)) {
        if (value === null || key === 'contextUsed' || key === 'contextWindow') continue;
        usage[key] = key === 'peakContext' ? Math.max(usage[key] ?? 0, value) : (usage[key] ?? 0) + value;
      }

    }
    const knownTokens = usage => usage.inputTokens === null && usage.outputTokens === null ? null : (usage.inputTokens ?? 0) + (usage.outputTokens ?? 0);
    function coverage(rows) {
      const turns = rows.filter(row => row.source === 'conversation');
      const complete = turns.filter(row => row.measurement.complete && row.measurement.usage.inputTokens !== null && row.measurement.usage.outputTokens !== null).length;
      const unknown = turns.filter(row => row.measurement.usage.inputTokens === null && row.measurement.usage.outputTokens === null).length;
      return { total: turns.length, complete, partial: turns.length - complete - unknown, unknown };
    }
    function sessionGroups(rows) {
      return [...new Set(rows.filter(row => row.conversationId).map(row => row.conversationId))].map(id => {
        const items = rows.filter(row => row.conversationId === id);
        return { id, items, usage: aggregate(items), coverage: coverage(items) };
      }).sort((a, b) => (knownTokens(b.usage) ?? -1) - (knownTokens(a.usage) ?? -1));
    }
    globalThis.telemetryPreview = { records, aggregate, filterRecords, knownTokens, coverage, sessionGroups };

      for (const [name, items] of models) {
        const model = aggregate(items), line = node('div', 'model-row');
        line.append(node('span', '', name), node('span', '', `${compact(model.inputTokens)} ${t('inputModel')} · ${compact(model.outputTokens)} ${t('outputModel')}`)); $('models').append(line);
      }
      if (!models.size) $('models').append(node('p', 'note', t('noModels')));
    }
    render();
  </script>
</body>
</html>
