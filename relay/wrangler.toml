# The team relay routes connections to a Durable Object per team. Deploy with npm run relay:deploy or run
# locally at ws://127.0.0.1:8787 with npm run relay:dev.
name = "prometeu-relay"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "TEAM"
class_name = "TeamRoom"

# SQLite is supported on the free plan and is the Durable Object's only storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamRoom"]

[[durable_objects.bindings]]
name = "REMOTE"
class_name = "RemoteDevice"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RemoteDevice"]
