[package]
name = "prometeu-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "prometeu-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
portable-pty = "0.9"
prometeu-core = { path = "../core" }
prometeu-process = { path = "../process" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
