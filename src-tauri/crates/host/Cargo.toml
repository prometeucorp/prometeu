[package]
name = "prometeu-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "prometeu-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
prometeu-core = { path = "../core" }
prometeu-process = { path = "../process" }
