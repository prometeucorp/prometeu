[package]
name = "prometeu-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
prometeu-profiles = { path = "../profiles" }
prometeu-tools = { path = "../tools" }
prometeu-git = { path = "../git" }
prometeu-files = { path = "../files" }
prometeu-core = { path = "../core" }
prometeu-process = { path = "../process" }
prometeu-protocols = { path = "../protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
portable-pty = "0.9"

[dev-dependencies]
prometeu-oauth = { path = "../oauth" }
prometeu-bridge = { path = "../bridge" }
