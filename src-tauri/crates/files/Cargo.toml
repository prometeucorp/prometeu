[package]
name = "prometeu-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
prometeu-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
trash = "5"
sha2 = "0.10"
