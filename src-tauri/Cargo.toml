[package]
name = "prometeu"
version = "0.16.0"
edition = "2021"
rust-version = "1.88"
# Cargo binary names cannot contain spaces. The Dock name comes from CFBundleName
# in the Info.plist embedded by tauri-build; see tauri.dev.conf.json for development.
default-run = "Prometeu"

[[bin]]
name = "Prometeu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The unstable feature enables child webviews (Window::add_child). The browser tab
# overlays a system webview on the window center; see browser.rs.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-dialog = "2"
# The updater verifies the new bundle with minisign before replacing the app.
# The process plugin restarts it afterward.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
toml = "0.8"
# Signal whole process groups so session shutdown reaches grandchildren such as
# the Node process started by npm run dev; see pty.rs.
libc = "0.2"
# Linear uses blocking OAuth/GraphQL calls on the Tauri thread pool. Reuse the
# updater's rustls/ring TLS stack through features; see linear.rs.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
# reqwest rustls-no-provider requires installing a crypto provider before any
# HTTPS client. Waiting for the updater to install it caused earlier requests
# to panic; see main.rs.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# PKCE encodes the verifier's SHA-256 digest as base64url for code_challenge.
sha2 = "0.10"
base64 = "0.22"
# Codex plugin cache versions must remain valid semver even when a compatible
# manifest supplies an arbitrary version string.
semver = "1"
# Tree deletions go to the system trash so untracked work stays recoverable.
trash = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Reuse Tauri bindings to receive screenshots before they exist as files.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSFilePromiseReceiver", "NSPasteboard", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSView", "NSResponder", "NSWindow", "NSColor", "objc2-quartz-core", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSURL", "NSError", "NSOperation", "NSBundle"] }
block2 = "0.6"
# Already used by Tauri; expose WebKit snapshot and child-view permission APIs.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin", "objc2-app-kit", "objc2-core-foundation", "block2"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }

# Already used by Tauri; read pasted images, which WebKitGTK does not expose to the page.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
png = "0.17"
