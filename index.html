<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prometeu</title>
  </head>
  <body>
    <!-- The app body sits above a full-width global status bar. -->
    <div class="shell">
    <!-- Navigation stays available across workspace changes. -->
    <nav class="rail" id="rail">
      <div class="railtop" data-tauri-drag-region="deep">
        <button id="railtoggle" class="ico" data-t-title="rail.hide"></button>
        <span class="spacer"></span>
        <button id="back" class="ico nav" data-t-title="nav.back" disabled></button>
        <button id="fwd" class="ico" data-t-title="nav.fwd" disabled></button>
      </div>
      <div class="railbody" id="railbody"></div>
      <!-- The sidebar footer reserves space for version and app-level controls. -->
      <div class="railfoot">
        <button id="settings" class="ico sm" data-t-title="top.settings"></button>
        <span class="ver" id="ver"></span>
        <span class="spacer"></span>
        <button id="update" class="ghost sm" hidden></button>
      </div>
    </nav>

    <div class="stack">
      <header class="top" data-tauri-drag-region="deep">
        <button id="railshow" class="ico" data-t-title="rail.show" hidden></button>
        <div id="crumb" class="crumb"></div>
        <span class="spacer"></span>
        <span id="msg" class="msg" role="status"></span>
        <div id="wsctl" class="wsctl" hidden>
          <!-- Collaboration occupies the toolbar only when active. Initial sharing and stage changes
               remain workspace menu actions. -->
          <button id="share" class="ico" hidden></button>
          <span id="watchers" class="watchers"></span>
          <!-- Inject PR instructions and Git state into the active conversation. The agent performs the
               work; the adjacent menu opens existing PRs per repository. -->
          <div class="split" id="prsplit">
            <button id="pr" data-t-title="top.pr"></button>
            <button id="prpick" class="ico sm" data-t-title="top.pr.links" hidden></button>
          </div>
          <button id="wsmore" class="ico" data-t-title="top.more"></button>
          <button id="sidetoggle" class="ico" data-t-title="top.side"></button>
        </div>
      </header>

      <main>
        <!-- The desk is the initial view, with one panel per active conversation, rendered by desk.ts. -->
        <section id="deskView" class="view desk" hidden>
          <div class="listmain">
            <!-- Conversation controls follow desk order and toggle collapsed panels. -->
            <div class="subbar tabbar" id="deskbar"></div>
            <div class="tiles" id="tiles"></div>
          </div>
        </section>

        <!-- Linear issues assigned to the user and actions to create workspaces, rendered by issues.ts. -->
        <section id="issuesView" class="view issues" hidden>
          <div class="listmain">
            <div class="subbar ibar" id="ibar"></div>
            <div class="iteams" id="iteams" hidden></div>
            <div class="ilist" id="ilist"></div>
          </div>
        </section>

        <!-- Archived workspaces, search and worktree cleanup, rendered by archived.ts. -->
        <section id="archivedView" class="view issues" hidden>
          <div class="listmain">
            <div class="subbar ibar" id="abar"></div>
            <div class="ilist" id="alist"></div>
          </div>
        </section>

        <!-- App-level integration and preference settings, rendered by settings.ts. -->
        <section id="settingsView" class="view settings" hidden></section>

        <section id="wsView" class="view wsview" hidden>
          <div class="center" id="wscenter">
            <div class="subbar tabbar" id="tabbar"></div>
            <div class="tabbody" id="tabbody">
            <!-- The conversation timeline and composer are created by chat.ts. -->
            <div class="chatwrap" id="chatwrap">
              <!-- Show preparation progress or retained history after worktree cleanup. -->
              <div class="offline" id="offline" hidden>
                <span class="offwave" id="offwave" hidden></span>
                <h3 id="offtitle" data-t="gone.title"></h3>
                <p id="offbody" data-t="gone.body"></p>
                <span class="path" id="offpath"></span>
              </div>
            </div>
            <!-- All file diffs share one stacked scrolling view. -->
            <div class="diffview" id="diffview" hidden>
              <div class="vbar">
                <span class="vcrumb" id="dcrumb"></span>
                <div id="dlayout" role="group" hidden></div>
                <span id="dprogress" role="status" hidden></span>
                <span id="dnext" hidden></span>
                <!-- Mark current diffs reviewed; subsequent agent changes increase the badge again. -->
                <button id="dseen" class="ico" data-t-title="diff.seenAll"></button>
                <button id="dfold" class="ico" data-t-title="diff.foldAll"></button>
              </div>
              <div class="dlist" id="dlist"></div>
            </div>
            <!-- The browser shares the center with the existing conversation and its draft. -->
            <div id="websplit" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="chatwrap" aria-valuemin="20" aria-valuemax="70" aria-valuenow="40" data-t-title="web.resize" hidden></div>
            <div class="webview" id="webview" hidden>
              <div class="vbar">
                <button id="wback" class="ico" data-t-title="web.back"></button>
                <button id="wfwd" class="ico" data-t-title="web.fwd"></button>
                <input class="wurl" id="wurl" type="text" spellcheck="false" autocomplete="off" data-t-title="web.url" />
                <span class="spacer"></span>
                <button id="wreload" class="ico" data-t-title="web.reload"></button>
                <button id="wext" class="ico" data-t-title="web.external"></button>
              </div>
              <div id="webtools" class="webtools"></div>
              <div id="webstage" class="webstage">
                <div class="webbody" id="webbody"></div>
              </div>
              <div id="webdetails" class="webdetails" hidden></div>
            </div>
            <!-- Free terminals occupy center tabs. Setup and Run remain in the side panel. -->
            <div class="termview" id="termview" hidden><div id="shellterm"></div></div>
            <!-- Opening a file from the tree replaces the central conversation view. -->
            <div class="viewer" id="viewer" hidden>
              <div class="vbar" id="vbar">
                <span class="vcrumb" id="vcrumb"></span>
                <span class="spacer"></span>
                <div class="viewmode" id="vview" role="group" hidden></div>
                <button id="vcopy" class="ico" data-t-title="viewer.copyPath"></button>
                <button id="vsave" class="ico" data-t-title="viewer.save" hidden></button>
                <button id="vcancel" class="ico" data-t-title="viewer.cancel" hidden></button>
              </div>
              <!-- Command-F searches the open code buffer; viewer.ts builds the query field. -->
              <div class="vfind" id="vfind" role="search" hidden>
                <span class="vfindn" id="vfindn" role="status" aria-live="polite"></span>
                <button id="vfindprev" class="ico" data-t-title="viewer.find.prev"></button>
                <button id="vfindnext" class="ico" data-t-title="viewer.find.next"></button>
                <button id="vfindclose" class="ico" data-t-title="viewer.find.close"></button>
              </div>
              <div class="vcode" id="vcode">
                <div class="gutter" id="vgutter"></div>
                <!-- Overlay syntax-highlighted pre content with a transparent-text editor that owns the
                     caret and selection. -->
                <div class="vstack">
                  <textarea id="vtext" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
                  <!-- Find matches draw as transparent-text marks between the editor and the highlighted text. -->
                  <pre id="vmarks" aria-hidden="true"></pre>
                  <pre id="vpre"></pre>
                </div>
              </div>
              <div class="vread md" id="vread" hidden></div>
              <!-- Render non-code files as a PDF iframe, CSV table, or image. -->
              <div class="vfile" id="vfile" hidden></div>
            </div>
            </div>
          </div>
          <aside class="side" id="side">
            <!-- Drag the left-edge handle to resize the panel. -->
            <div class="sideresize" id="sideresize"></div>
            <div class="sidetabs">
              <button id="tab-files" class="sidetab on" data-t="side.files"></button>
              <button id="tab-diff" class="sidetab"><span data-t="side.changes"></span> <span id="diffcount"></span></button>
              <button id="tab-comments" class="sidetab" hidden><span data-t="side.comments"></span> <span id="commentcount"></span></button>
              <span class="spacer"></span>
              <!-- Show the complete stacked review diff only when changes exist. -->
              <button id="review" class="ghost sm" data-t-title="side.review.title" hidden></button>
              <button id="collapse" class="ico" data-t-title="side.collapse"></button>
              <button id="reveal" class="ico" data-t-title="side.reveal"></button>
            </div>
            <div class="sidebody">
              <div class="tree" id="tree"></div>
              <div class="difflist" id="difflist" hidden></div>
              <div class="comments" id="comments" hidden></div>
            </div>
            <!-- Setup prepares the worktree and Run starts its project. Free terminals live in center
                 tabs; neither script is an agent session. -->
            <div class="dock" id="dock">
              <div class="docktabs">
                <button id="dock-toggle" class="ico" data-t-title="dock.collapse"></button>
                <div class="dockstrip" id="dockstrip"></div>
                <span class="spacer"></span>
                <button id="run-open" hidden></button>
                <div class="split" id="runsplit" hidden>
                  <button id="run-go" class="md"></button>
                  <button id="run-pick" class="ico sm" data-t-title="dock.pick"></button>
                </div>
                <button id="dock-again" class="ico" data-t-title="dock.again" hidden></button>
              </div>
              <div class="dockbody">
                <div class="dockwrap" id="dockwrap" hidden><div id="dockterm"></div></div>
                <!-- main builds the current empty state rather than retaining duplicate fixed
                     placeholders. -->
                <div class="dockempty" id="dockempty">
                  <div class="glyph" id="empty-glyph" hidden></div>
                  <h4 id="empty-title"></h4>
                  <div class="row" id="empty-row"></div>
                  <p id="empty-sub"></p>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </main>
    </div>
    </div>

    <!-- The full-width global status bar shows account quotas and machine resources, independently of
         the selected workspace. -->
    <footer class="status" id="status"></footer>

    <div class="veil" id="veil" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
